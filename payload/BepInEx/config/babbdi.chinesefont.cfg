## Settings file was created by plugin BABBDI 中文字体支持 v1.1.0
## Plugin GUID: babbdi.chinesefont

[General]

## true = 把游戏里所有文本都强制换成中文字体；false = 只作为缺字回退字体（推荐，保留游戏原有英文字体风格）
# Setting type: Boolean
# Default value: false
OverrideAllFonts = false

## 手动指定中文字体文件完整路径（.ttf/.otf/.ttc），例如 C:\Windows\Fonts\Deng.ttf，留空为自动选择
# Setting type: String
# Default value: 
FontFile = 

## 输出详细的调试日志
# Setting type: Boolean
# Default value: true
VerboseLogging = true

## 调试用：把游戏运行时的所有文本写入日志，用于核对汉化词典
# Setting type: Boolean
# Default value: false
DumpGameTexts = false

## 补漏层：自动翻译那些在插件挂钩之前就已写入、XUnity 没抓到的文本（如选项面板标签）
# Setting type: Boolean
# Default value: true
TranslateLeftovers = true

## 修正短标签排版：给差一点点就放不下的中文按钮标签开启自动缩放，避免被拆成两行
# Setting type: Boolean
# Default value: true
FixShortLabelWrapping = true

